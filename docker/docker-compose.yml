services:

  db:
    image: postgres:17
    container_name: nova-oms-db
    environment:
      - POSTGRES_DB=nova_oms
      - POSTGRES_USER=nova
      - POSTGRES_PASSWORD=nova
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  
  stack:
    image:  localstack/localstack:latest
    container_name: nova-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,lambda,apigateway,cloudformation,iam,ssm,secretsmanager,cloudwatch,logs,events,sqs,scheduler,stepfunctions,transcribe,ses,sesv2,rds,ec2,cognito-idp
      DEBUG: 1
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      S3_SKIP_SIGNATURE_VALIDATION: 0
      PERSISTENCE: 1

    volumes:
      - "./.localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"


  s3:
    image: minio/minio:latest
    container_name: nova-oms-s3
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web
    environment:
      MINIO_ROOT_USER: nova
      MINIO_ROOT_PASSWORD: nova12345   # mínimo 8 caracteres
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mb:
    image: minio/mc
    container_name: nova-minio-init
    depends_on:
      s3:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: nova
      MINIO_ROOT_PASSWORD: nova12345
      BUCKET_NAME: ${AWS_S3_BUCKET:-nova-bucket}
      WEBHOOK_URL: ${AWS_S3_WEBHOOK_URL:-http://host.docker.internal:3000/attachments/confirm}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://s3:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$BUCKET_NAME &&
      mc admin config set local notify_webhook:uploads endpoint=$$WEBHOOK_URL &&
      mc admin service restart local --json &&
      sleep 3 &&
      mc event add local/$$BUCKET_NAME arn:minio:sqs::uploads:webhook --event put &&
      echo 'Bucket y webhook configurados correctamente'
      "

volumes:
  postgres_data:
  minio_data: