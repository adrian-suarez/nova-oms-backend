version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile
    
  build:
    commands:
      - pnpm typecheck
      - pnpm lint
      - pnpm test
      - pnpm cdk:synth

artifacts:
  base-directory: cdk.out
  files:
    - '**/**'